<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>aura • shared gallery</title>
    <style>
        /* same beautiful glass-morphism design – keep as before */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0c0f15 0%, #1a1d24 100%);
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 100px;
            color: #eef2f6;
        }

        .glass-card {
            background: rgba(30, 35, 45, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .header {
            padding: 20px 24px;
            margin-bottom: 20px;
            background: rgba(20, 25, 35, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 32px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #a5b4fc, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.3px;
        }

        .stats {
            display: flex;
            gap: 28px;
            align-items: center;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #b0b8c5;
            font-weight: 400;
        }

        .stat-number {
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 20px;
        }

        .nickname-container {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nickname-input {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 40px;
            padding: 8px 16px;
            color: white;
            font-size: 14px;
            width: 140px;
        }

        .nickname-input::placeholder {
            color: #9ca3af;
        }

        .save-nickname {
            background: rgba(129,140,248,0.3);
            border: none;
            border-radius: 30px;
            padding: 8px 16px;
            color: white;
            cursor: pointer;
            font-size: 13px;
            backdrop-filter: blur(5px);
        }

        /* slideshow */
        .slideshow-section {
            padding: 20px;
            margin-bottom: 20px;
            background: rgba(25, 30, 40, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 32px;
        }

        .slideshow-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 16px;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .slideshow-container {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
            border-radius: 24px;
            background: #1e2533;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .slide.active {
            opacity: 1;
        }

        /* create album */
        .create-album {
            padding: 24px;
            margin-bottom: 24px;
            background: rgba(28, 33, 45, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 32px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 18px;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .album-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .album-form input {
            flex: 1;
            min-width: 220px;
            padding: 16px 20px;
            background: rgba(15, 20, 30, 0.6);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            color: white;
            font-size: 16px;
        }

        .album-form input:focus {
            outline: none;
            border-color: #818cf8;
            background: rgba(25, 30, 45, 0.8);
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 32px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 20px -5px rgba(99,102,241,0.5);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        /* upload area */
        .upload-section {
            padding: 28px 24px;
            margin-bottom: 28px;
            background: rgba(28, 33, 48, 0.6);
            backdrop-filter: blur(12px);
            border: 2px dashed rgba(129, 140, 248, 0.5);
            border-radius: 40px;
        }

        .upload-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .upload-icon {
            font-size: 56px;
            filter: drop-shadow(0 10px 15px #6366f180);
            margin-bottom: 8px;
        }

        .upload-header h3 {
            font-size: 22px;
            font-weight: 600;
            background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .upload-header p {
            color: #9ca3af;
            font-size: 14px;
        }

        .upload-controls {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .album-select {
            width: 100%;
            padding: 16px 20px;
            background: rgba(15, 20, 30, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 36px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .cloudinary-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            padding: 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .cloudinary-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        /* albums grid */
        .albums-section {
            padding: 24px;
            margin-bottom: 28px;
            background: rgba(25, 30, 42, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 36px;
        }

        .albums-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 16px;
        }

        .album-card {
            background: rgba(20, 25, 38, 0.7);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 24px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .album-card:active {
            transform: scale(0.97);
            border-color: #818cf8;
        }

        .album-cover {
            width: 100%;
            height: 120px;
            background: #1e2538;
            border-radius: 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            overflow: hidden;
            box-shadow: 0 10px 20px -10px black;
        }

        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .album-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .album-name {
            font-weight: 600;
            color: #e0e7ff;
        }

        .album-count {
            color: #a5b4fc;
            font-weight: 600;
            background: rgba(0,0,0,0.2);
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 13px;
        }

        /* sorting bar */
        .sort-bar {
            display: flex;
            gap: 12px;
            margin: 16px 0;
            align-items: center;
        }

        .sort-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px;
            padding: 8px 20px;
            color: #cbd5e1;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sort-btn.active {
            background: #6366f1;
            color: white;
            border-color: #6366f1;
        }

        /* photos grid */
        .photos-section {
            padding: 24px;
            background: rgba(25, 30, 42, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 36px;
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 16px;
        }

        .photo-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            background: #1a1f30;
            box-shadow: 0 8px 16px -8px black;
            transition: transform 0.2s;
        }

        .photo-item:active {
            transform: scale(0.96);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 10px;
            color: white;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .photo-item:hover .photo-overlay {
            opacity: 1;
        }

        .like-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 30px;
            padding: 4px 10px;
            font-size: 13px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
        }

        .like-btn.liked {
            background: #ef4444;
        }

        .uploader-name {
            font-weight: 500;
            text-shadow: 0 2px 5px black;
        }

        .time-ago {
            font-size: 11px;
            color: #ccc;
        }

        /* modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(30px);
            z-index: 1000;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: flex-end;
            padding: 16px;
        }

        .modal-close {
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .modal-media {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .modal-media img {
            max-width: 100%;
            max-height: 60vh;
            object-fit: contain;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }

        .modal-info {
            background: rgba(20,25,40,0.7);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 20px;
            margin-top: 20px;
            width: 100%;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-like {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-download {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            text-decoration: none;
            padding: 16px 30px;
            border-radius: 40px;
            font-weight: 600;
            box-shadow: 0 15px 30px -10px #6366f1;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #9ca3af;
            grid-column: 1/-1;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(20,25,40,0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 16px;
            border-radius: 30px;
            text-align: center;
            animation: slideUp 0.3s ease;
            z-index: 1000;
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (min-width: 600px) {
            .photos-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>✦ aura shared gallery</h1>
        <div class="stats">
            <div class="stat-item"><span>📸</span><span class="stat-number" id="totalPhotos">0</span> photos</div>
            <div class="stat-item"><span>❤️</span><span class="stat-number" id="totalLikes">0</span> likes</div>
            <div class="nickname-container">
                <input type="text" id="nicknameInput" class="nickname-input" placeholder="your name" maxlength="20">
                <button class="save-nickname" onclick="saveNickname()">save</button>
            </div>
        </div>
    </div>

    <!-- Slideshow -->
    <div class="slideshow-section">
        <div class="slideshow-title"><span>✨</span> Slide show</div>
        <div class="slideshow-container" id="slideshow"></div>
    </div>

    <!-- Create Album (now works immediately) -->
    <div class="create-album">
        <div class="section-title"><span>➕</span> New album</div>
        <div class="album-form">
            <input type="text" id="albumName" placeholder="e.g. Vacation, Family">
            <button class="btn-primary" onclick="createAlbum()">Create</button>
        </div>
    </div>

    <!-- Upload -->
    <div class="upload-section">
        <div class="upload-header">
            <div class="upload-icon">☁️</div>
            <h3>upload to cloudinary</h3>
            <p>everyone sees your photos</p>
        </div>
        <div class="upload-controls">
            <select class="album-select" id="albumSelect"><option value="">choose album...</option></select>
            <button class="cloudinary-btn" id="uploadWidgetBtn"><span>📤</span> select photos</button>
        </div>
    </div>

    <!-- Albums Grid (updates in real time) -->
    <div class="albums-section">
        <div class="section-title"><span>📁</span> albums</div>
        <div class="albums-grid" id="albumsGrid"></div>
    </div>

    <!-- Sort & Filter -->
    <div class="sort-bar">
        <span style="color:#9ca3af;">sort by:</span>
        <button class="sort-btn active" onclick="setSort('latest')" id="sortLatest">latest</button>
        <button class="sort-btn" onclick="setSort('likes')" id="sortLikes">most liked</button>
    </div>

    <!-- All Photos -->
    <div class="photos-section">
        <div class="section-title"><span>🕒</span> all photos</div>
        <div class="photos-grid" id="photosGrid"></div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-header"><div class="modal-close" onclick="closeModal()">✕</div></div>
        <div class="modal-media">
            <img id="modalImage">
            <div class="modal-info">
                <div>
                    <div id="modalUploader" style="font-weight:600;"></div>
                    <div id="modalTime" style="font-size:13px; color:#aaa;"></div>
                </div>
                <div class="modal-like">
                    <span id="modalLikes">0</span>
                    <button class="like-btn" id="modalLikeBtn" onclick="likeCurrentPhoto()">❤️</button>
                </div>
                <a href="#" class="modal-download" id="downloadBtn" download>download</a>
            </div>
        </div>
    </div>

    <!-- Firebase & Cloudinary -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://upload-widget.cloudinary.com/global/all.js"></script>

    <script>
        // ================= YOUR FIREBASE CONFIG =================
        const firebaseConfig = {
            apiKey: "AIzaSyABx7Ib6YfFWBluHO1YXDBeZnl11iIN6n4",
            authDomain: "mygallery-e45c6.firebaseapp.com",
            projectId: "mygallery-e45c6",
            storageBucket: "mygallery-e45c6.firebasestorage.app",
            messagingSenderId: "588469648646",
            appId: "1:588469648646:web:e420054db627356e42b287",
            measurementId: "G-8T48W44E5Y"
        };

        // Cloudinary (already set)
        const CLOUD_NAME = 'dhzahjwcp';
        const UPLOAD_PRESET = 'Mattwygallerypreset';
        // ========================================================

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Global variables
        let allPhotos = [];
        let albums = [];               // will hold album docs
        let currentSort = 'latest';
        let currentAlbum = null;       // filter by album name
        let currentPhotoId = null;
        let nickname = localStorage.getItem('nickname') || 'anonymous';

        document.getElementById('nicknameInput').value = nickname;

        window.saveNickname = function() {
            const newNick = document.getElementById('nicknameInput').value.trim();
            if (newNick) {
                nickname = newNick;
                localStorage.setItem('nickname', newNick);
                showMessage(`👤 name saved as ${newNick}`);
            }
        };

        // Load albums from Firestore
        function loadAlbums() {
            db.collection('albums').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                albums = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                renderAlbums();
            });
        }

        // Load photos from Firestore
        function loadPhotos() {
            db.collection('photos').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
                allPhotos = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                updateStats();
                renderPhotos();
                updateSlideshow();
                updateAlbumSelect();   // update dropdown with photo-based albums too
                renderAlbums();         // re-render albums to update counts
            }, error => {
                console.error("Firestore error:", error);
                showMessage("⚠️ Firestore error – check rules and database");
            });
        }

        // Render albums grid from 'albums' collection
        function renderAlbums() {
            const grid = document.getElementById('albumsGrid');
            if (albums.length === 0) {
                grid.innerHTML = '<div class="empty-state" style="grid-column:span2;">no albums yet – create one!</div>';
                return;
            }

            grid.innerHTML = albums.map(album => {
                const photoCount = allPhotos.filter(p => p.album === album.name).length;
                const coverPhoto = allPhotos.find(p => p.album === album.name);
                return `
                    <div class="album-card" onclick="filterByAlbum('${album.name}')">
                        <div class="album-cover">${coverPhoto ? `<img src="${coverPhoto.url}">` : '📁'}</div>
                        <div class="album-info">
                            <span class="album-name">${album.name}</span>
                            <span class="album-count">${photoCount}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Update album dropdown (for upload) – includes all albums from both sources
        function updateAlbumSelect() {
            const select = document.getElementById('albumSelect');
            // Combine album names from albums collection and from photos (to be safe)
            const albumNames = new Set();
            albums.forEach(a => albumNames.add(a.name));
            allPhotos.forEach(p => { if (p.album) albumNames.add(p.album); });

            select.innerHTML = '<option value="">choose album...</option>';
            Array.from(albumNames).sort().forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);
            });
        }

        // Filter photos by album when clicking album card
        window.filterByAlbum = function(albumName) {
            currentAlbum = albumName;
            setSort(currentSort);  // re-render with filter
        };

        // Create new album (stores in Firestore)
        window.createAlbum = async function() {
            const name = document.getElementById('albumName').value.trim();
            if (!name) return showMessage('enter album name');

            // Check if album already exists (case-insensitive)
            const exists = albums.some(a => a.name.toLowerCase() === name.toLowerCase());
            if (exists) return showMessage('album already exists');

            try {
                await db.collection('albums').add({
                    name: name,
                    createdBy: nickname,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                showMessage(`✅ album "${name}" created`);
                document.getElementById('albumName').value = '';
            } catch (e) {
                console.error(e);
                showMessage('❌ failed to create album');
            }
        };

        // Update stats
        function updateStats() {
            document.getElementById('totalPhotos').textContent = allPhotos.length;
            const totalLikes = allPhotos.reduce((acc, p) => acc + (p.likes || 0), 0);
            document.getElementById('totalLikes').textContent = totalLikes;
        }

        // Render photos (with filter & sort)
        function renderPhotos() {
            let filtered = currentAlbum 
                ? allPhotos.filter(p => p.album === currentAlbum)
                : [...allPhotos];

            if (currentSort === 'latest') {
                filtered.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
            } else {
                filtered.sort((a,b) => (b.likes || 0) - (a.likes || 0));
            }

            const grid = document.getElementById('photosGrid');
            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-state"><span>🌅</span><p>no photos yet</p></div>';
                return;
            }

            grid.innerHTML = filtered.map(photo => `
                <div class="photo-item" onclick="openModal('${photo.id}')">
                    <img src="${photo.url}" loading="lazy">
                    <div class="photo-overlay">
                        <span class="uploader-name">${photo.uploader || 'anonymous'}</span>
                        <div style="display:flex; gap:8px; align-items:center;">
                            <span>❤️ ${photo.likes || 0}</span>
                            <span class="time-ago">${timeAgo(photo.timestamp)}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function timeAgo(timestamp) {
            if (!timestamp) return '';
            const seconds = Math.floor((Date.now() - timestamp.seconds*1000) / 1000);
            if (seconds < 60) return 'just now';
            const minutes = Math.floor(seconds/60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes/60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.floor(hours/24);
            return `${days}d ago`;
        }

        function updateSlideshow() {
            const container = document.getElementById('slideshow');
            if (allPhotos.length === 0) {
                container.innerHTML = '<div style="color:#9ca3af; text-align:center; padding:80px;">no photos yet</div>';
                return;
            }
            const shuffled = [...allPhotos].sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, 5);
            container.innerHTML = selected.map((photo, i) => 
                `<img src="${photo.url}" class="slide ${i === 0 ? 'active' : ''}" alt="slide">`
            ).join('');
            let current = 0;
            setInterval(() => {
                const slides = document.querySelectorAll('.slide');
                if (!slides.length) return;
                slides[current].classList.remove('active');
                current = (current + 1) % slides.length;
                slides[current].classList.add('active');
            }, 3500);
        }

        window.setSort = function(sortType) {
            currentSort = sortType;
            document.getElementById('sortLatest').classList.toggle('active', sortType === 'latest');
            document.getElementById('sortLikes').classList.toggle('active', sortType === 'likes');
            renderPhotos();
        };

        // Upload widget
        document.getElementById('uploadWidgetBtn').addEventListener('click', function() {
            const albumName = document.getElementById('albumSelect').value;
            if (!albumName) return showMessage('select an album first');
            const widget = cloudinary.createUploadWidget(
                { cloudName: CLOUD_NAME, uploadPreset: UPLOAD_PRESET, sources: ['local', 'camera'], multiple: true, maxFiles: 10, clientAllowedFormats: ['image'] },
                async (error, result) => {
                    if (!error && result && result.event === 'success') {
                        const info = result.info;
                        try {
                            await db.collection('photos').add({
                                url: info.secure_url,
                                publicId: info.public_id,
                                album: albumName,
                                uploader: nickname,
                                likes: 0,
                                likedBy: [],
                                timestamp: firebase.firestore.FieldValue.serverTimestamp()
                            });
                            showMessage(`✅ uploaded: ${info.original_filename}`);
                        } catch (e) {
                            console.error(e);
                            showMessage('❌ failed to save to database');
                        }
                    }
                }
            );
            widget.open();
        });

        window.openModal = function(photoId) {
            const photo = allPhotos.find(p => p.id === photoId);
            if (!photo) return;
            currentPhotoId = photoId;
            document.getElementById('modalImage').src = photo.url;
            document.getElementById('modalUploader').textContent = photo.uploader || 'anonymous';
            document.getElementById('modalTime').textContent = timeAgo(photo.timestamp);
            document.getElementById('modalLikes').textContent = photo.likes || 0;
            document.getElementById('downloadBtn').href = photo.url;
            document.getElementById('modal').classList.add('active');
        };

        window.closeModal = function() {
            document.getElementById('modal').classList.remove('active');
        };

        window.likeCurrentPhoto = async function() {
            if (!currentPhotoId) return;
            const photoRef = db.collection('photos').doc(currentPhotoId);
            await photoRef.update({
                likes: firebase.firestore.FieldValue.increment(1)
            });
        };

        function showMessage(msg) {
            const toast = document.createElement('div'); toast.className = 'toast'; toast.textContent = msg;
            document.body.appendChild(toast); setTimeout(() => toast.remove(), 2500);
        }

        // Start
        loadAlbums();
        loadPhotos();

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
    </script>
</body>
</html>
