<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>aura • your private gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0a0c;
            --bg-card: #111315;
            --surface: #1a1d21;
            --surface-light: #2a2f35;
            --primary: #6366f1;
            --primary-glow: #818cf8;
            --accent: #10b981;
            --text: #ffffff;
            --text-secondary: #9ca3af;
            --border: #2d3138;
            --gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-card);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--surface-light);
            border-radius: 4px;
        }

        /* Header - fixed height, no overflow */
        .header {
            background: rgba(17, 19, 21, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(45, 49, 56, 0.5);
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--gradient);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transform: rotate(-5deg);
            box-shadow: 0 8px 16px -4px rgba(99, 102, 241, 0.5);
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        /* Stats - now fits perfectly */
        .stats {
            display: flex;
            gap: 12px;
            background: var(--surface);
            padding: 6px 12px;
            border-radius: 30px;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            white-space: nowrap;
        }

        .stat-value {
            font-weight: 700;
            color: var(--primary);
        }

        /* Main container - better padding */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Connection card - compact */
        .connection-card {
            background: linear-gradient(135deg, rgba(99,102,241,0.1) 0%, rgba(139,92,246,0.1) 100%);
            border: 1px solid rgba(99,102,241,0.3);
            border-radius: 20px;
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .connection-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .connection-dot {
            width: 10px;
            height: 10px;
            background: #f59e0b;
            border-radius: 50%;
            box-shadow: 0 0 15px #f59e0b;
            animation: pulse 2s infinite;
        }

        .connection-text h3 {
            font-size: 16px;
            margin-bottom: 2px;
        }

        .connection-text p {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .connection-badge {
            background: var(--surface);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            border: 1px solid var(--border);
            white-space: nowrap;
        }

        /* Section header - more compact */
        .section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .section-header-icon {
            width: 32px;
            height: 32px;
            background: var(--gradient);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .section-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        /* Create album - better button fit */
        .create-album {
            background: var(--surface);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .album-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .album-form input {
            flex: 2;
            min-width: 220px;
            padding: 14px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text);
            font-size: 15px;
            transition: all 0.3s;
        }

        .album-form input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
        }

        .btn-primary {
            background: var(--gradient);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            flex: 1;
            justify-content: center;
            min-width: 140px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -5px rgba(99,102,241,0.5);
        }

        /* Upload area - cleaner */
        .upload-area {
            background: var(--surface);
            border: 2px dashed var(--border);
            border-radius: 24px;
            padding: 32px 20px;
            margin-bottom: 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            border-color: var(--primary);
            transform: scale(1.01);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .upload-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .upload-subtitle {
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-size: 14px;
        }

        /* Upload controls - FIXED BUTTON LAYOUT */
        .upload-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .album-select {
            background: var(--surface-light);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 40px;
            color: var(--text);
            font-size: 14px;
            min-width: 180px;
            cursor: pointer;
            flex: 1;
            max-width: 220px;
        }

        .btn-secondary {
            background: var(--surface-light);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-secondary:hover {
            background: var(--surface);
            border-color: var(--primary);
        }

        /* Albums grid - perfect fit */
        .albums-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .album-card {
            background: var(--surface);
            border-radius: 20px;
            padding: 16px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.3s;
        }

        .album-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 12px 24px -8px rgba(99,102,241,0.3);
        }

        .album-cover {
            width: 100%;
            aspect-ratio: 1;
            background: var(--surface-light);
            border-radius: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            overflow: hidden;
        }

        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .album-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .album-name {
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100px;
        }

        .album-count {
            color: var(--text-secondary);
            font-size: 13px;
            background: var(--surface-light);
            padding: 3px 8px;
            border-radius: 16px;
        }

        /* Photos grid */
        .photos-section {
            background: var(--surface);
            border-radius: 24px;
            padding: 20px;
            margin-top: 24px;
            border: 1px solid var(--border);
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 6px;
            margin-top: 16px;
        }

        .photo-item {
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            background: var(--surface-light);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .photo-item:hover img {
            transform: scale(1.1);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            z-index: 1000;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: flex-end;
            padding: 12px;
        }

        .modal-close {
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-media {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-media img, .modal-media video {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 12px;
        }

        .modal-download {
            background: var(--gradient);
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 20px auto;
            width: fit-content;
            min-width: 180px;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            grid-column: 1/-1;
        }

        .empty-state-icon {
            font-size: 60px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 18px;
            color: var(--text);
            margin-bottom: 6px;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* Progress bar */
        .progress-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: transparent;
            z-index: 1000;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background: var(--gradient);
            width: 0%;
            transition: width 0.3s;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            max-width: 360px;
            margin: 0 auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.5);
            animation: slideUp 0.3s ease;
            z-index: 1000;
        }

        .toast-success {
            width: 22px;
            height: 22px;
            background: #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Mobile fixes */
        @media (max-width: 640px) {
            .header-content {
                flex-direction: column;
                align-items: stretch;
            }
            
            .stats {
                justify-content: space-around;
            }
            
            .album-form {
                flex-direction: column;
            }
            
            .btn-primary {
                width: 100%;
            }
            
            .upload-controls {
                flex-direction: column;
            }
            
            .album-select {
                max-width: 100%;
                width: 100%;
            }
            
            .btn-secondary {
                width: 100%;
                justify-content: center;
            }
            
            .albums-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            
            .photos-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .modal-download {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Progress bar -->
    <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">✨</div>
                <span class="logo-text">aura</span>
            </div>
            
            <div class="stats">
                <div class="stat-item">
                    <span>📸</span>
                    <span class="stat-value" id="totalPhotos">0</span>
                </div>
                <div class="stat-item">
                    <span>📁</span>
                    <span class="stat-value" id="totalAlbums">0</span>
                </div>
                <div class="stat-item">
                    <span>⚡</span>
                    <span>10GB</span>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Connection Status - DEMO MODE (Cloudflare tomorrow) -->
        <div class="connection-card">
            <div class="connection-info">
                <div class="connection-dot"></div>
                <div class="connection-text">
                    <h3>Demo Mode Active</h3>
                    <p>Ready for Cloudflare setup tomorrow</p>
                </div>
            </div>
            <div class="connection-badge">
                ⚡ Local Storage
            </div>
        </div>

        <!-- Create Album -->
        <div class="create-album">
            <div class="section-header">
                <div class="section-header-icon">✨</div>
                <h2>Create new album</h2>
            </div>
            
            <div class="album-form">
                <input type="text" id="albumName" placeholder="Album name (e.g., Summer 2025)">
                <button class="btn-primary" onclick="createAlbum()">
                    <span>✨</span>
                    Create
                </button>
            </div>
        </div>

        <!-- Upload Area - FIXED BUTTON LAYOUT -->
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">☁️</div>
            <h3 class="upload-title">Upload to your gallery</h3>
            <p class="upload-subtitle">Drag & drop or click to select photos</p>
            
            <div class="upload-controls">
                <select id="albumSelect" class="album-select">
                    <option value="">Choose album...</option>
                </select>
                
                <button class="btn-secondary" onclick="document.getElementById('fileInput').click()">
                    <span>📤</span>
                    Select Photos
                </button>
            </div>
        </div>

        <!-- Albums Grid -->
        <div class="section-header">
            <div class="section-header-icon">📁</div>
            <h2>Your albums</h2>
        </div>
        
        <div class="albums-grid" id="albumsGrid"></div>

        <!-- Recent Photos -->
        <div class="photos-section">
            <div class="section-header">
                <div class="section-header-icon">🕒</div>
                <h2>Recent memories</h2>
            </div>
            
            <div class="photos-grid" id="recentGrid"></div>
        </div>
    </main>

    <!-- Hidden file input -->
    <input type="file" id="fileInput" multiple accept="image/*,video/*" style="display: none;">

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-header">
            <div class="modal-close" onclick="closeModal()">✕</div>
        </div>
        <div class="modal-media">
            <img id="modalImage" style="display: none;">
            <video id="modalVideo" controls style="display: none;"></video>
        </div>
        <a href="#" class="modal-download" id="downloadBtn" download>
            <span>📥</span>
            Download
        </a>
    </div>

    <script>
        // DEMO MODE - Works without Cloudflare
        // Tomorrow you'll replace with Cloudflare config
        
        let albums = JSON.parse(localStorage.getItem('auraAlbums')) || {};
        let recentItems = JSON.parse(localStorage.getItem('auraRecent')) || [];

        // Initialize with default albums if empty
        if (Object.keys(albums).length === 0) {
            albums = {
                'Favorites': { photos: [] },
                'Travel': { photos: [] }
            };
        }

        // Save data
        function saveData() {
            localStorage.setItem('auraAlbums', JSON.stringify(albums));
            localStorage.setItem('auraRecent', JSON.stringify(recentItems.slice(0, 30)));
            updateStats();
        }

        // Update stats
        function updateStats() {
            const totalPhotos = Object.values(albums).reduce((sum, album) => sum + album.photos.length, 0);
            const totalAlbums = Object.keys(albums).length;
            
            document.getElementById('totalPhotos').textContent = totalPhotos;
            document.getElementById('totalAlbums').textContent = totalAlbums;
        }

        // Show toast
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `
                <div class="toast-success">✓</div>
                <div>${message}</div>
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Create album
        window.createAlbum = function() {
            const name = document.getElementById('albumName').value.trim();
            if (!name) {
                showToast('Please enter an album name');
                return;
            }
            if (albums[name]) {
                showToast('Album already exists');
                return;
            }
            albums[name] = { photos: [] };
            saveData();
            renderAll();
            document.getElementById('albumName').value = '';
            showToast(`✨ Album "${name}" created`);
        };

        // Handle file upload
        document.getElementById('fileInput').addEventListener('change', async function(e) {
            const files = Array.from(e.target.files);
            const albumName = document.getElementById('albumSelect').value;

            if (!albumName) {
                showToast('Please select an album');
                return;
            }
            if (!albums[albumName]) {
                showToast('Album not found');
                return;
            }

            // Show progress
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            progressContainer.style.display = 'block';

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                
                // Update progress
                progressBar.style.width = `${((i + 1) / files.length) * 100}%`;

                // Demo: Use placeholder images
                // Tomorrow with Cloudflare, this will upload to your bucket
                const photoUrl = `https://images.unsplash.com/photo-${1500000000 + i}?w=400&auto=format`;
                
                const photo = {
                    id: Date.now() + '_' + i,
                    url: photoUrl,
                    name: file.name,
                    type: 'image',
                    date: new Date().toISOString(),
                    album: albumName
                };

                albums[albumName].photos.push(photo);
                recentItems.unshift(photo);
            }

            setTimeout(() => {
                progressContainer.style.display = 'none';
                progressBar.style.width = '0%';
            }, 500);

            saveData();
            renderAll();
            showToast(`✅ Uploaded ${files.length} photos`);
        });

        // Render albums
        function renderAlbums() {
            const grid = document.getElementById('albumsGrid');
            const select = document.getElementById('albumSelect');
            
            grid.innerHTML = '';
            select.innerHTML = '<option value="">Choose album...</option>';

            Object.keys(albums).forEach(albumName => {
                const album = albums[albumName];
                
                const option = document.createElement('option');
                option.value = albumName;
                option.textContent = albumName;
                select.appendChild(option);

                const card = document.createElement('div');
                card.className = 'album-card';
                card.onclick = () => openAlbum(albumName);

                let coverHtml = '<div class="album-cover">📁</div>';
                if (album.photos.length > 0) {
                    const lastPhoto = album.photos[album.photos.length - 1];
                    coverHtml = `<div class="album-cover"><img src="${lastPhoto.url}" alt=""></div>`;
                }

                card.innerHTML = `
                    ${coverHtml}
                    <div class="album-info">
                        <span class="album-name">${albumName}</span>
                        <span class="album-count">${album.photos.length}</span>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // Open album
        window.openAlbum = function(albumName) {
            const album = albums[albumName];
            
            const modal = document.createElement('div');
            modal.className = 'modal active';
            modal.style.background = 'var(--surface)';
            
            const photosHtml = album.photos.map(photo => `
                <div class="photo-item" onclick="viewPhoto('${photo.url}', '${photo.type}', event)">
                    <img src="${photo.url}" alt="">
                </div>
            `).join('');
            
            modal.innerHTML = `
                <div class="modal-header" style="justify-content: space-between;">
                    <h2 style="color: white; font-size: 20px;">${albumName}</h2>
                    <div class="modal-close" onclick="this.closest('.modal').remove()">✕</div>
                </div>
                <div style="flex: 1; overflow-y: auto; padding: 16px;">
                    <div class="photos-grid">
                        ${photosHtml || '<div class="empty-state"><div class="empty-state-icon">📸</div><h3>No photos yet</h3><p>Upload your first photo</p></div>'}
                    </div>
                </div>
                <button onclick="addToAlbum('${albumName}')" class="btn-secondary" style="margin: 16px auto; width: fit-content;">
                    <span>📤</span>
                    Add Photos
                </button>
            `;
            
            document.body.appendChild(modal);
        };

        window.addToAlbum = function(albumName) {
            document.querySelector('.modal.active')?.remove();
            document.getElementById('albumSelect').value = albumName;
            document.getElementById('fileInput').click();
        };

        window.viewPhoto = function(url, type, event) {
            event.stopPropagation();
            const modal = document.getElementById('modal');
            const modalImage = document.getElementById('modalImage');
            const modalVideo = document.getElementById('modalVideo');
            const downloadBtn = document.getElementById('downloadBtn');

            modal.classList.add('active');
            modalImage.style.display = 'block';
            modalVideo.style.display = 'none';
            modalImage.src = url;
            downloadBtn.href = url;
        };

        window.closeModal = function() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('modalVideo').pause();
        };

        function renderRecent() {
            const grid = document.getElementById('recentGrid');
            
            if (recentItems.length === 0) {
                grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🌅</div><h3>No memories yet</h3><p>Upload your first photo</p></div>';
                return;
            }
            
            grid.innerHTML = recentItems.slice(0, 12).map(photo => `
                <div class="photo-item" onclick="viewPhoto('${photo.url}', '${photo.type}', event)">
                    <img src="${photo.url}" alt="">
                </div>
            `).join('');
        }

        function renderAll() {
            renderAlbums();
            renderRecent();
            updateStats();
        }

        // Initialize
        renderAll();

        // Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // Drag and drop
        const uploadArea = document.getElementById('uploadArea');
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'var(--primary)';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = 'var(--border)';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'var(--border)';
            
            const files = Array.from(e.dataTransfer.files);
            const albumName = document.getElementById('albumSelect').value;
            
            if (!albumName) {
                showToast('Please select an album first');
                return;
            }
            
            if (files.length > 0) {
                document.getElementById('fileInput').files = e.dataTransfer.files;
                document.getElementById('fileInput').dispatchEvent(new Event('change'));
            }
        });
    </script>
</body>
</html>
