<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wyrielle & Matt • private storage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0B0E14;
            --bg-secondary: #14181F;
            --surface: #1E242C;
            --surface-light: #2A313C;
            --accent-primary: #6366f1;
            --accent-secondary: #8B5CF6;
            --accent-glow: rgba(99, 102, 241, 0.5);
            --text-primary: #FFFFFF;
            --text-secondary: #94A3B8;
            --text-tertiary: #64748B;
            --border: #2D3748;
            --success: #10B981;
            --gradient: linear-gradient(135deg, #6366f1, #8B5CF6);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--surface-light);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }

        /* Animated background */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
            pointer-events: none;
            z-index: -1;
        }

        /* Header */
        .header {
            background: rgba(20, 24, 31, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1440px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }

        /* Logo section - exact size */
        .logo {
            display: flex;
            align-items: center;
            gap: 16px;
            height: 48px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: var(--gradient);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transform: rotate(-5deg);
            box-shadow: 0 8px 16px -4px var(--accent-glow);
            flex-shrink: 0;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-name {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }

        .logo-sub {
            font-size: 14px;
            color: var(--text-tertiary);
            letter-spacing: 0.5px;
        }

        /* Storage stats - exact size */
        .storage-stats {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--surface);
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid var(--border);
            height: 48px;
        }

        .storage-used {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .storage-total {
            font-size: 14px;
            color: var(--text-tertiary);
        }

        .storage-bar {
            width: 80px;
            height: 6px;
            background: var(--surface-light);
            border-radius: 3px;
            overflow: hidden;
        }

        .storage-fill {
            height: 100%;
            width: 0%;
            background: var(--gradient);
            border-radius: 3px;
            transition: width 0.3s;
        }

        /* Main container - exact max width */
        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 24px 32px;
        }

        /* Welcome section - exact spacing */
        .welcome {
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            height: 60px;
        }

        .welcome h1 {
            font-size: 28px;
            font-weight: 600;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-date {
            font-size: 16px;
            color: var(--text-tertiary);
            padding: 8px 16px;
            background: var(--surface);
            border-radius: 30px;
            border: 1px solid var(--border);
        }

        /* Connection card - exact size */
        .connection-card {
            background: linear-gradient(135deg, rgba(99,102,241,0.12), rgba(139,92,246,0.12));
            border: 1px solid rgba(99,102,241,0.3);
            border-radius: 20px;
            padding: 20px 24px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            backdrop-filter: blur(8px);
            height: 84px;
        }

        .connection-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .connection-dot {
            width: 14px;
            height: 14px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--success);
            animation: pulse 2s infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .connection-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .connection-text h3 {
            font-size: 18px;
            font-weight: 600;
        }

        .connection-text p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .connection-badge {
            background: var(--surface);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid var(--border);
            height: 40px;
            display: flex;
            align-items: center;
        }

        /* Create album section - exact spacing */
        .create-section {
            background: var(--surface);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 32px;
            border: 1px solid var(--border);
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            height: 40px;
        }

        .section-header-icon {
            width: 40px;
            height: 40px;
            background: var(--gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .section-header h2 {
            font-size: 20px;
            font-weight: 600;
        }

        .album-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            min-height: 58px;
        }

        .album-form input {
            flex: 1;
            min-width: 280px;
            height: 58px;
            padding: 0 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 16px;
            transition: all 0.2s;
        }

        .album-form input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
        }

        .btn-primary {
            height: 58px;
            padding: 0 32px;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 16px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -4px var(--accent-glow);
        }

        /* Upload area - exact size */
        .upload-area {
            background: var(--surface);
            border: 2px dashed var(--border);
            border-radius: 28px;
            padding: 36px 24px;
            margin-bottom: 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            min-height: 260px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .upload-area:hover {
            border-color: var(--accent-primary);
            background: rgba(99,102,241,0.02);
        }

        .upload-icon {
            font-size: 56px;
            margin-bottom: 16px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .upload-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .upload-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .upload-select {
            height: 48px;
            padding: 0 24px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--text-primary);
            font-size: 15px;
            cursor: pointer;
            margin: 0 8px;
            min-width: 200px;
        }

        /* Albums grid - exact sizing */
        .albums-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .album-card {
            background: var(--surface);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            height: 220px;
            display: flex;
            flex-direction: column;
        }

        .album-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-primary);
            box-shadow: 0 12px 24px -8px rgba(99,102,241,0.3);
        }

        .album-cover {
            width: 100%;
            height: 120px;
            background: var(--surface-light);
            border-radius: 14px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .album-card:hover .album-cover img {
            transform: scale(1.1);
        }

        .album-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 32px;
        }

        .album-name {
            font-weight: 600;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
        }

        .album-count {
            font-size: 14px;
            color: var(--text-tertiary);
            background: var(--surface-light);
            padding: 4px 10px;
            border-radius: 20px;
            height: 28px;
            display: flex;
            align-items: center;
        }

        /* Delete button */
        .delete-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: #ef4444;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s;
            z-index: 10;
        }

        .album-card:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: scale(1.1);
        }

        /* Photos section */
        .photos-section {
            background: var(--surface);
            border-radius: 28px;
            padding: 24px;
            margin-top: 32px;
            border: 1px solid var(--border);
        }

        .photos-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            height: 40px;
        }

        .photos-header h2 {
            font-size: 20px;
            font-weight: 600;
        }

        .photos-count {
            font-size: 14px;
            color: var(--text-tertiary);
            background: var(--surface-light);
            padding: 6px 14px;
            border-radius: 30px;
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 8px;
        }

        .photo-item {
            aspect-ratio: 1;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            background: var(--surface-light);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .photo-item:hover img {
            transform: scale(1.1);
        }

        .photo-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .photo-item:hover .photo-badge {
            opacity: 1;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.98);
            backdrop-filter: blur(16px);
            z-index: 1000;
            padding: 40px;
        }

        .modal.active {
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: flex-end;
            padding: 16px;
            height: 80px;
        }

        .modal-close {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        .modal-media {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-media img,
        .modal-media video {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 16px;
        }

        .modal-download {
            position: absolute;
            bottom: 40px;
            right: 40px;
            height: 56px;
            padding: 0 32px;
            background: var(--gradient);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .modal-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -4px var(--accent-glow);
        }

        /* Progress bar */
        .progress-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: transparent;
            z-index: 1000;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background: var(--gradient);
            width: 0%;
            transition: width 0.2s;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-tertiary);
            grid-column: 1 / -1;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 20px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.2s ease;
            z-index: 1000;
            white-space: nowrap;
            min-width: 300px;
            height: 56px;
        }

        .toast-success {
            width: 24px;
            height: 24px;
            background: var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            flex-shrink: 0;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translate(-50%, 20px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .welcome {
                height: auto;
                flex-direction: column;
                align-items: flex-start;
            }
            
            .connection-card {
                height: auto;
                padding: 16px;
            }
            
            .toast {
                min-width: 90%;
                white-space: normal;
            }
            
            .modal-download {
                bottom: 20px;
                right: 20px;
                left: 20px;
                width: auto;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>

    <!-- Progress bar -->
    <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">✨</div>
                <div class="logo-text">
                    <span class="logo-name">Wyrielle & Matt</span>
                    <span class="logo-sub">private storage</span>
                </div>
            </div>
            
            <div class="storage-stats">
                <span class="storage-used" id="storageUsed">0 MB</span>
                <span class="storage-total">/ 10 GB</span>
                <div class="storage-bar">
                    <div class="storage-fill" id="storageFill" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Welcome section -->
        <div class="welcome">
            <h1>your private space</h1>
            <div class="welcome-date" id="currentDate"></div>
        </div>

        <!-- Connection status -->
        <div class="connection-card">
            <div class="connection-left">
                <div class="connection-dot"></div>
                <div class="connection-text">
                    <h3>Cloudflare R2 • Secure</h3>
                    <p>Your memories are encrypted and safe</p>
                </div>
            </div>
            <div class="connection-badge">
                ⚡ 10 GB Free
            </div>
        </div>

        <!-- Create album -->
        <div class="create-section">
            <div class="section-header">
                <div class="section-header-icon">📁</div>
                <h2>Create new album</h2>
            </div>
            
            <div class="album-form">
                <input type="text" id="albumName" placeholder="Album name (e.g., Summer 2025, Family, Travel)">
                <button class="btn-primary" onclick="createAlbum()">
                    <span>✨</span>
                    Create Album
                </button>
            </div>
        </div>

        <!-- Upload area -->
        <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">☁️</div>
            <h3 class="upload-title">Upload to your cloud</h3>
            <p class="upload-subtitle">Drag & drop or click to select photos</p>
            
            <select id="albumSelect" onclick="event.stopPropagation()" class="upload-select">
                <option value="">Choose an album...</option>
            </select>
            
            <button class="btn-primary" type="button" style="margin-top: 20px;" onclick="event.stopPropagation();document.getElementById('fileInput').click()">
                <span>📤</span>
                Select Photos
            </button>
        </div>

        <!-- Albums grid -->
        <div class="section-header" style="margin-bottom: 20px;">
            <div class="section-header-icon">📚</div>
            <h2>Your albums</h2>
        </div>
        
        <div class="albums-grid" id="albumsGrid"></div>

        <!-- Recent photos -->
        <div class="photos-section">
            <div class="photos-header">
                <h2>Recent memories</h2>
                <span class="photos-count" id="totalPhotosCount">0 photos</span>
            </div>
            
            <div class="photos-grid" id="recentGrid"></div>
        </div>
    </main>

    <!-- Hidden file input -->
    <input type="file" id="fileInput" multiple accept="image/*,video/*" style="display: none;">

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-header">
            <div class="modal-close" onclick="closeModal()">✕</div>
        </div>
        <div class="modal-media">
            <img id="modalImage" style="display: none;">
            <video id="modalVideo" controls style="display: none;"></video>
        </div>
        <a href="#" class="modal-download" id="downloadBtn" download>
            <span>📥</span>
            Download
        </a>
    </div>

    <script>
        // Cloudflare R2 Configuration
        const R2_CONFIG = {
            accountId: 'YOUR_ACCOUNT_ID',
            bucketName: 'YOUR_BUCKET_NAME',
            publicUrl: 'https://pub-YOUR_ID.r2.dev'
        };

        // Data storage (this keeps all your photos forever!)
        let albums = JSON.parse(localStorage.getItem('wyrielle_matt_albums')) || {};
        let recentItems = JSON.parse(localStorage.getItem('wyrielle_matt_recent')) || [];

        // Initialize with welcome albums if empty
        if (Object.keys(albums).length === 0) {
            albums = {
                'Favorites': { photos: [], created: new Date().toISOString() },
                'Travel': { photos: [], created: new Date().toISOString() },
                'Family': { photos: [], created: new Date().toISOString() }
            };
        }

        // Set current date
        const date = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('currentDate').textContent = date.toLocaleDateString('en-US', options);

        // Save data (this makes photos persist forever!)
        function saveData() {
            localStorage.setItem('wyrielle_matt_albums', JSON.stringify(albums));
            localStorage.setItem('wyrielle_matt_recent', JSON.stringify(recentItems.slice(0, 30)));
            updateStats();
        }

        // Update all stats
        function updateStats() {
            const totalPhotos = Object.values(albums).reduce((sum, album) => sum + album.photos.length, 0);
            const totalAlbums = Object.keys(albums).length;
            
            document.getElementById('totalPhotosCount').textContent = totalPhotos + ' ' + (totalPhotos === 1 ? 'photo' : 'photos');
            
            // Update storage stats (estimate 5MB per photo)
            const estimatedMB = totalPhotos * 5;
            const usedGB = (estimatedMB / 1024).toFixed(2);
            document.getElementById('storageUsed').textContent = estimatedMB < 1024 ? estimatedMB + ' MB' : usedGB + ' GB';
            document.getElementById('storageFill').style.width = Math.min((estimatedMB / 10240) * 100, 100) + '%';
        }

        // Show toast notification
        function showToast(message, isSuccess = true) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `
                <div class="toast-success">✓</div>
                <div>${message}</div>
            `;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.remove(), 3000);
        }

        // Create album
        window.createAlbum = function() {
            const name = document.getElementById('albumName').value.trim();
            if (!name) {
                showToast('Please enter an album name', false);
                return;
            }

            if (albums[name]) {
                showToast('Album already exists', false);
                return;
            }

            albums[name] = { photos: [], created: new Date().toISOString() };
            saveData();
            renderAll();
            document.getElementById('albumName').value = '';
            showToast(`✨ Album "${name}" created`);
        };

        // Delete album
        window.deleteAlbum = function(albumName, event) {
            event.stopPropagation();
            
            if (confirm(`Delete "${albumName}" and all its photos?`)) {
                delete albums[albumName];
                saveData();
                renderAll();
                showToast(`🗑️ Album "${albumName}" deleted`);
            }
        };

        // Handle file upload
        document.getElementById('fileInput').addEventListener('change', async function(e) {
            const files = Array.from(e.target.files);
            const albumName = document.getElementById('albumSelect').value;

            if (!albumName) {
                showToast('Please select an album', false);
                return;
            }

            if (!albums[albumName]) {
                showToast('Album not found', false);
                return;
            }

            // Show progress
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            progressContainer.style.display = 'block';

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                
                // Update progress
                progressBar.style.width = `${((i + 1) / files.length) * 100}%`;

                // Create a unique ID for the photo
                const photoId = Date.now() + '_' + i + '_' + Math.random().toString(36).substr(2, 9);
                
                // Create object URL for the photo
                const url = URL.createObjectURL(file);
                
                const photo = {
                    id: photoId,
                    url: url,
                    name: file.name,
                    type: file.type.startsWith('image/') ? 'image' : 'video',
                    date: new Date().toISOString(),
                    album: albumName,
                    size: file.size
                };

                albums[albumName].photos.push(photo);
                recentItems.unshift(photo);
            }

            // Hide progress
            setTimeout(() => {
                progressContainer.style.display = 'none';
                progressBar.style.width = '0%';
            }, 500);

            saveData();
            renderAll();
            showToast(`✨ Uploaded ${files.length} photo${files.length > 1 ? 's' : ''} to "${albumName}"`);
        });

        // Render albums
        function renderAlbums() {
            const grid = document.getElementById('albumsGrid');
            const select = document.getElementById('albumSelect');
            
            grid.innerHTML = '';
            select.innerHTML = '<option value="">Choose an album...</option>';

            Object.keys(albums).forEach(albumName => {
                const album = albums[albumName];
                
                // Add to select
                const option = document.createElement('option');
                option.value = albumName;
                option.textContent = albumName;
                select.appendChild(option);

                // Create album card
                const card = document.createElement('div');
                card.className = 'album-card';
                card.onclick = () => openAlbum(albumName);

                // Get cover photo
                let coverHtml = '<div class="album-cover">📁</div>';
                if (album.photos.length > 0) {
                    const lastPhoto = album.photos[album.photos.length - 1];
                    coverHtml = `<div class="album-cover"><img src="${lastPhoto.url}" alt=""></div>`;
                }

                card.innerHTML = `
                    <div class="delete-btn" onclick="deleteAlbum('${albumName}', event)">🗑️</div>
                    ${coverHtml}
                    <div class="album-info">
                        <span class="album-name">${albumName}</span>
                        <span class="album-count">${album.photos.length}</span>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // Open album
        window.openAlbum = function(albumName) {
            const album = albums[albumName];
            
            const modal = document.createElement('div');
            modal.className = 'modal active';
            modal.style.background = 'var(--surface)';
            
            const photosHtml = album.photos.map(photo => `
                <div class="photo-item" onclick="viewPhoto('${photo.id}', '${photo.type}', '${albumName}', event)">
                    <img src="${photo.url}" alt="">
                    <span class="photo-badge">${photo.type === 'video' ? '▶' : '📷'}</span>
                </div>
            `).join('');
            
            modal.innerHTML = `
                <div class="modal-header" style="justify-content: space-between;">
                    <h2 style="color: white; font-size: 24px;">${albumName}</h2>
                    <div class="modal-close" onclick="this.closest('.modal').remove()">✕</div>
                </div>
                <div style="flex: 1; overflow-y: auto; padding: 20px;">
                    <div class="photos-grid">
                        ${photosHtml || '<div class="empty-state"><div class="empty-state-icon">📸</div><h3>No photos yet</h3><p>Upload your first photo to this album</p></div>'}
                    </div>
                </div>
                <button onclick="addToAlbum('${albumName}')" class="btn-primary" style="margin: 20px auto;">
                    <span>📤</span>
                    Add Photos
                </button>
            `;
            
            document.body.appendChild(modal);
        };

        // Add to album
        window.addToAlbum = function(albumName) {
            document.querySelector('.modal.active')?.remove();
            document.getElementById('albumSelect').value = albumName;
            document.getElementById('fileInput').click();
        };

        // View photo
        window.viewPhoto = function(photoId, type, albumName, event) {
            event.stopPropagation();
            
            const album = albums[albumName];
            const photo = album.photos.find(p => p.id === photoId);
            
            if (!photo) return;
            
            const modal = document.getElementById('modal');
            const modalImage = document.getElementById('modalImage');
            const modalVideo = document.getElementById('modalVideo');
            const downloadBtn = document.getElementById('downloadBtn');

            modal.classList.add('active');
            
            if (type === 'image') {
                modalImage.style.display = 'block';
                modalVideo.style.display = 'none';
                modalImage.src = photo.url;
            } else {
                modalVideo.style.display = 'block';
                modalImage.style.display = 'none';
                modalVideo.src = photo.url;
            }
            
            downloadBtn.href = photo.url;
        };

        // Close modal
        window.closeModal = function() {
            const modal = document.getElementById('modal');
            const modalVideo = document.getElementById('modalVideo');
            modal.classList.remove('active');
            modalVideo.pause();
        };

        // Render recent photos
        function renderRecent() {
            const grid = document.getElementById('recentGrid');
            
            if (recentItems.length === 0) {
                grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🌅</div><h3>No memories yet</h3><p>Upload your first photo to get started</p></div>';
                return;
            }
            
            grid.innerHTML = recentItems.slice(0, 12).map(photo => `
                <div class="photo-item" onclick="viewPhoto('${photo.id}', '${photo.type}', '${photo.album}', event)">
                    <img src="${photo.url}" alt="">
                </div>
            `).join('');
        }

        function renderAll() {
            renderAlbums();
            renderRecent();
            updateStats();
        }

        // Initialize
        renderAll();

        // Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // Drag and drop
        const uploadArea = document.getElementById('uploadArea');
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'var(--accent-primary)';
            uploadArea.style.background = 'rgba(99,102,241,0.02)';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = 'var(--border)';
            uploadArea.style.background = 'transparent';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'var(--border)';
            uploadArea.style.background = 'transparent';
            
            const files = Array.from(e.dataTransfer.files);
            const albumName = document.getElementById('albumSelect').value;
            
            if (!albumName) {
                showToast('Please select an album first', false);
                return;
            }
            
            if (files.length > 0) {
                // Create a new FileList-like object
                const dataTransfer = new DataTransfer();
                files.forEach(file => dataTransfer.items.add(file));
                document.getElementById('fileInput').files = dataTransfer.files;
                document.getElementById('fileInput').dispatchEvent(new Event('change'));
            }
        });
    </script>
</body>
</html>
